<svg xmlns="http://w3.org" width="280" height="280" viewBox="0 0 280 280" style="background:#070a12; border: 4px solid #00d2ff; border-radius: 4px;">
  <defs>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <rect width="35" height="35" fill="#0d1117"/>
      <rect x="35" width="35" height="35" fill="#161b22"/>
      <rect y="35" width="35" height="35" fill="#161b22"/>
      <rect x="35" y="35" height="35" fill="#0d1117"/>
    </pattern>
    <linearGradient id="laser" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="280" height="280" fill="url(#grid)" />
  <rect width="280" height="10" fill="url(#laser)">
    <animate attributeName="y" values="-10;280;-10" dur="4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="52" cy="52" r="8" fill="#00d2ff">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <line x1="52" y1="52" x2="122" y2="122" stroke="#00d2ff" stroke-width="2" stroke-dasharray="4">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1s" repeatCount="indefinite"/>
  </line>
  <circle cx="122" cy="122" r="10" fill="none" stroke="#ff0055" stroke-width="3"/>
  <circle cx="192" cy="52" r="8" fill="#00d2ff" />
  <circle cx="122" cy="192" r="8" fill="#00d2ff" />
</svg>
